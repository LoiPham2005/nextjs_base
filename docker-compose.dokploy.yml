# Docker Compose tối ưu cho Dokploy (hoặc Coolify) khi dùng Database ngoài (Neon / Supabase)

services:
  # Chạy migration một lần lúc deploy để apply schema vào Neon DB rồi dừng lại
  migrate:
    build:
      context: .
      target: migrator
    container_name: nextjs_prisma_migrate
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-${DATABASE_URL}}

  web:
    build:
      context: .
      target: runner
    container_name: nextjs_prisma_web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-${DATABASE_URL}}
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SESSION_SECRET: ${SESSION_SECRET:-}
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: ${QUEUE_ENABLED:-1}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-1}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: nextjs_prisma_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  realtime:
    build:
      context: .
      target: realtime
    container_name: nextjs_prisma_realtime
    restart: unless-stopped
    deploy:
      replicas: ${REALTIME_ENABLED:-1}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3002
      REDIS_URL: redis://redis:6379
      REALTIME_CORS_ORIGIN: ${REALTIME_CORS_ORIGIN:-${NEXT_PUBLIC_APP_URL}}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-1}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${REALTIME_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    container_name: nextjs_prisma_worker
    restart: unless-stopped
    deploy:
      replicas: ${QUEUE_ENABLED:-1}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-${DATABASE_URL}}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: ${QUEUE_ENABLED:-1}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 60s
