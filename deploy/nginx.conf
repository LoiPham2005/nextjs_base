# Reverse proxy nginx cho bản deploy VPS.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nextjs-base
#   sudo ln -s /etc/nginx/sites-available/nextjs-base /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: chạy `sudo certbot --nginx -d example.com` sau khi file này đã hoạt
# động — certbot sẽ tự chèn khối ssl và chuyển hướng 80 → 443.

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Ứng dụng đã set HSTS, CSP, X-Frame-Options... trong next.config.mjs và
    # src/proxy.ts. Không khai báo lại ở đây để tránh hai nguồn sự thật.

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cố tình KHÔNG thêm location riêng cho /_next/static: Next.js đã tự gửi
    # `Cache-Control: public, max-age=31536000, immutable` cho các file có
    # hash trong tên. Thêm `add_header` ở đây chỉ tạo ra header trùng lặp.

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;

        # QUAN TRỌNG: rate limit của app đọc X-Forwarded-For để phân biệt IP.
        # Thiếu dòng này thì mọi request trông như đến từ cùng một client, và
        # một người bị chặn sẽ khoá luôn tất cả những người còn lại.
        #
        # Dùng $remote_addr (không phải $proxy_add_x_forwarded_for): client có
        # thể tự gửi kèm header X-Forwarded-For giả để né rate limit. Ở đây ta
        # ghi đè bằng IP thật mà nginx nhìn thấy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Không để lộ endpoint health ra Internet nếu không cần.
    # location /api/health { allow 127.0.0.1; deny all; proxy_pass http://nextjs_upstream; }
}
