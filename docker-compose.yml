# `version:` đã bị Compose v2 bỏ và sẽ in cảnh báo nếu còn giữ.

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nextjs_prisma_base}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextjs_prisma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nextjs_prisma_base}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nextjs_prisma_base}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Chạy một lần rồi thoát. `web` đợi service này kết thúc thành công, nên
  # schema luôn được apply trước khi có request đầu tiên.
  migrate:
    build:
      context: .
      target: migrator
    container_name: nextjs_prisma_migrate
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    container_name: nextjs_prisma_web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: 3000
      # Rate limit dùng chung giữa các instance. Cùng một Redis với realtime —
      # khoá của rate limit mang tiền tố riêng nên hai bên không giẫm lên nhau.
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Chỉ `started`, không phải `healthy`: rate limit fail-open khi Redis
      # chưa sẵn sàng, nên web không có lý do gì phải đợi. Bắt đợi ở đây chỉ
      # làm chậm khởi động mà không đổi lại điều gì.
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  # Redis: BẮT BUỘC khi chạy từ 2 instance realtime trở lên. Không có nó, client
  # nối vào instance A sẽ không nhận được tin phát từ instance B — im lặng,
  # không lỗi nào cả.
  redis:
    image: redis:7-alpine
    container_name: nextjs_prisma_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  realtime:
    build:
      context: .
      target: realtime
    container_name: nextjs_prisma_realtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3002
      REDIS_URL: redis://redis:6379
      REALTIME_CORS_ORIGIN: ${REALTIME_CORS_ORIGIN:-http://localhost:3000}
      # Phải TRÙNG KHỚP với app chính: token do web/mobile cấp được verify ở đây.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET là bắt buộc}
    ports:
      - "${REALTIME_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
